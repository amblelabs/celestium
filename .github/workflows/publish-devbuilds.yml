name: Automated Builds

on:
  workflow_dispatch:
  push:
    paths:
      - common/**
      - fabric/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradle/**
      - gradlew
      - gradlew.bat
      - versioning.gradle
      - .github/workflows/*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Java 21 & 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build
        run: ./gradlew :fabric:26.3:build

      - name: Publish artifacts
        uses: drtheodor/discord-webhook-upload-action@v0.4
        with:
          url: ${{ secrets.DEV_BUILDS }}
          username: Space Core
          avatar: 'https://static.wikia.nocookie.net/portal-2-pti/images/c/cc/In_game_Space_Core.png/revision/latest?cb=20190227181319'

          message: |
            <:new1:1253371736510959636><:new2:1253371805734015006> New **⋆｡ﾟ:ringed_planet:｡⋆｡ ﾟ｡⋆ ᴄᴇʟᴇsᴛɪᴜᴍ .𖥔 ݁ ˖ִ:flying_saucer:༄˖°** dev build [**`#${{ github.run_number }}`**](<https://github.com/amblelabs/celestium/actions/runs/${{ github.run_id }}>):
            ${commits}

          file: |
            fabric/versions/26.3/build/libs/*.jar
            !fabric/versions/26.3/build/libs/*-sources.jar

      - name: Send failure notice
        if: failure()
        uses: drtheodor/discord-webhook-upload-action@v0.4
        with:
          url: ${{ secrets.DEV_BUILDS }}
          username: Space
          avatar: 'https://i.imgur.com/LAzH4IT.jpeg'

          message: |
            <:al_error:1513885241339678852> New **Celestium** dev build [**`#${{ github.run_number }}`**](<https://github.com/amblelabs/celestium/actions/runs/${{ github.run_id }}>) **failed** to build! <a:al_explosion:1467652202356150272>
